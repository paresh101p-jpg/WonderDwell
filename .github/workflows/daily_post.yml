name: WonderDwell Daily Home Post

on:
  schedule:
    # 4:00 PM IST = 10:30 UTC daily
    - cron: '30 10 * * *'
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pillow google-genai

      - name: Run WonderDwell Auto Poster
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python auto_poster.py

      - name: Commit updated queue (used URLs)
        run: |
          git config --global user.name "WonderDwell Bot"
          git config --global user.email "bot@wonderdwell.auto"
          git add images_urls.txt used_urls.txt
          git diff --staged --quiet || git commit -m "WonderDwell daily post - queue updated"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

